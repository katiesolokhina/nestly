<!-- Shown by nginx while Nestly is down, so everything it needs is in this one file. -->
<style>
  :root { color-scheme: light dark; --bg: #F7F4FB; --surface: #FFFFFF; --ink: #1F2230; --muted: #5D5A6E; --border: #DCD3E8; --primary: #6B4C8F; --on-primary: #FFFFFF; --soft: #EDE7F6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15141B; --surface: #201E28; --ink: #ECEAF2; --muted: #A7A3B8; --border: #3A3545; --primary: #B996D6; --on-primary: #241533; --soft: #2A2535; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px 16px; text-align: center; max-width: 460px; margin: 0 auto; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; color: var(--primary); margin-bottom: 18px; }
  .nest { position: relative; width: 112px; height: 112px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; margin-bottom: 8px; }
  .nest img { width: 72px; height: 72px; animation: bob 2.4s ease-in-out infinite; }
  .nest::after { content: ""; position: absolute; bottom: 14px; width: 44px; height: 6px; border-radius: 50%; background: var(--border); animation: shadow 2.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.75); opacity: .5; } }
  h1 { font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; margin: 8px 0 0; }
  p { margin: 0; color: var(--muted); }
  .dots { display: inline-flex; gap: 6px; margin: 10px 0 6px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); animation: blink 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px; border-radius: 16px; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 700; text-decoration: none; margin-top: 14px; }
  .small { font-size: 14px; margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .nest img, .nest::after, .dots i { animation: none; } .dots i { opacity: .7; } }
</style>
